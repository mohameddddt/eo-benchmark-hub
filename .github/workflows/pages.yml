# Deploys the read-only showcase (frontend in static mode + the committed
# API snapshot in frontend/public/data) to GitHub Pages.
# Enable once: Settings → Pages → Source: GitHub Actions.
name: pages
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["frontend/**"]

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci && VITE_BASE=/${{ github.event.repository.name }}/ npm run build:static
      - run: cp frontend/dist/index.html frontend/dist/404.html   # SPA deep links
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
